[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flopsindex"
version = "0.8.2"
description = "Python SDK for FLOPS Index — live GPU compute pricing reference rates"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "zeroatflops", email = "team@flopsindex.com"}]
keywords = ["flops", "gpu", "pricing", "compute", "benchmark", "fintech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Zero external dependencies — stdlib urllib only.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://app.flopsindex.com"
Documentation = "https://app.flopsindex.com/llms.txt"
Source = "https://github.com/zeroatflops/flopsindex"
[tool.setuptools.packages.find]
where = ["."]
include = ["flopsindex*"]
