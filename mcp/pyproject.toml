[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flopsindex-mcp"
version = "0.12.3"
description = "MCP server for FLOPS public compute indices — catalog, search, price, verify. Works with Claude, Cursor, Windsurf, or any MCP host."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "zeroatflops", email = "team@flopsindex.com"}]
keywords = ["mcp", "flops", "gpu", "compute", "pricing", "reference-rate"]

dependencies = [
    "mcp>=1.3.0,<2",   # CAP: mcp 2.0.0 (2026-07-28) removed Server.list_tools/call_tool
    "httpx>=0.26.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://app.flopsindex.com"
Documentation = "https://app.flopsindex.com/llms.txt"
Repository = "https://github.com/zeroatflops/flopsindex"
"Source code" = "https://github.com/zeroatflops/flopsindex/tree/main/mcp"
"Issue tracker" = "https://github.com/zeroatflops/flopsindex/issues"

[project.scripts]
flopsindex-mcp = "flopsindex_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flopsindex_mcp*"]
